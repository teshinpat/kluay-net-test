<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บ้านกล้วยสร้างสรรค์</title>
<!-- เกมฐาน Lean / Quality ค่าย OMC · Banana Land ตอนที่ 2 (12 พ.ย. 2569) · รุ่นเวลาจริง
     ผู้ใช้ขอ 10 พ.ย.: เปลี่ยนจากแบบตาเป็นนาฬิกาเดินจริง กะละ 3 นาที งานที่ใช้เวลาต้องรอจนเสร็จ
     งานมีสองแบบ
       - งานเครื่อง (ตากกล้วย): เริ่มแล้วเดินไปทำอย่างอื่นได้ มีแถบความคืบหน้าบนลานตาก
       - งานติดตัว (เก็บกล้วย ขอลายเซ็น แพ็ก ฯลฯ): ตัวละครยืนนิ่งจนเสร็จ
     เสนอไอเดีย (N) ย้ายออกจากนาฬิกา ไปเป็นหน้าต่างที่หยุดเกมกลางกะ 1 เพราะไม่มีใครหยุดพิมพ์ตอนนาฬิกาเดิน
     รุ่นแบบตาเก็บไว้ที่ banana-walk.html เผื่อเล่นทดสอบแล้วรุ่นนี้ไม่เวิร์ก
     ตัวเลขทุกตัวอยู่ที่ RULE ตั้งจากบอต ยังไม่ได้เล่นทดสอบกับคนจริง -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#3d5a2a; --panel:#fff3cf; --panel-2:#f3dca0; --ink:#2b1d14; --ink-soft:#6e5434;
  --accent:#e0702e; --good:#2f8a3e; --bad:#c2452f; --coin:#f5c542; --coin-d:#b07d14; --line:#c9a46a; --px:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b2613; } }
:root[data-theme="dark"]{ --bg:#1b2613; }
*{box-sizing:border-box;border-radius:0 !important}
body{margin:0;color:var(--ink);font-family:'Mitr','IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5;
  background:var(--bg);background-image:linear-gradient(45deg,rgba(0,0,0,.08) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.08) 75%),
  linear-gradient(45deg,rgba(0,0,0,.08) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.08) 75%);background-size:16px 16px;background-position:0 0,8px 8px}
main{max-width:980px;margin:0 auto;padding:18px 20px 40px}
.px{font-family:'Press Start 2P','Mitr',sans-serif;font-size:.72em;letter-spacing:0;line-height:1.6}
/* ตัวเลข (11 พ.ย.): เปลี่ยนจาก Pixelify Sans เป็น Press Start 2P · เดิมเลข 5 ดูเป็นตัว S และ 0 กับ 8 แยกยาก
   Press Start กว้าง จึงลดขนาดทุกที่ที่ใช้ · ภาษาไทยในข้อความเดียวกันยังเป็น Mitr */
.card,button,.chip,.pick,select,input[type=text],.timebar{
  border:none;box-shadow:0 calc(-1*var(--px)) 0 0 var(--ink),0 var(--px) 0 0 var(--ink),calc(-1*var(--px)) 0 0 0 var(--ink),var(--px) 0 0 0 var(--ink)}
.card{background:var(--panel);padding:14px 16px;margin:18px var(--px);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),8px 8px 0 0 rgba(0,0,0,.35)}
h1{font-size:30px;margin:0} h2{font-size:22px;margin:0 0 8px} p{margin:6px 0}
.soft{color:var(--ink-soft)}
button{font:inherit;font-weight:500;cursor:pointer;background:var(--panel);color:var(--ink);padding:8px 14px;margin:4px;position:relative}
button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--px);background:rgba(0,0,0,.18)}
button:hover:not(:disabled){background:#fff}
button:active:not(:disabled){transform:translateY(var(--px))}
button:disabled{opacity:.45;cursor:not-allowed}
button.go{background:var(--accent);color:#fff;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.hud{display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:#fff;margin:4px}
.chip{background:var(--ink);color:#fff;padding:5px 10px;font-family:'Press Start 2P','Mitr',sans-serif;font-size:13px;line-height:1.5;
  box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.chip.warn{background:var(--bad)}
.timebar{flex:1;min-width:140px;height:18px;background:#2b1d14}
.timebar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#f5c542 0 10px,#e0902e 10px 12px)}
.quest{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:8px 12px;margin:16px 4px 0;min-height:44px;
  box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000}
.quest b{font-family:'Mitr',sans-serif;font-weight:600;color:#f5c542;white-space:nowrap}
.quest.tut{background:#fff3cf;color:var(--ink);flex-direction:column;align-items:flex-start;gap:2px;
  box-shadow:0 -4px 0 0 var(--accent),0 4px 0 0 var(--accent),-4px 0 0 0 var(--accent),4px 0 0 0 var(--accent)}
.quest.tut b{color:var(--accent)} .quest.tut .big2{font-size:18px;font-weight:600} .quest.tut small{color:var(--ink-soft)}
/* กันหน้าโยก (ผู้ใช้แจ้ง 10 พ.ย.): กล่องภารกิจ/บทสอน/ปุ่มงานถูกวาดใหม่ทุก 0.1 วิ
   ถ้าความสูงเปลี่ยนตามข้อความ (บรรทัดเหรียญหล่น นับถอยหลัง ปุ่มเพิ่ม/หาย) แผนที่ทั้งแผ่นจะเลื่อนขึ้นลง
   จึงล็อกความสูงไว้ และให้ข้อความยาวตัดท้ายแทนการดันกล่อง */
#quest{height:116px;display:flex;align-items:flex-end}
#quest .quest{width:100%;height:100%;overflow:hidden;margin-top:0}
#quest .quest:not(.tut){height:52px}
#act{height:118px;overflow:hidden}
/* ช่องของในตัว (ผู้ใช้ขอ 10 พ.ย.): ของในมือ 1 ช่อง + ใบออเดอร์ที่รับแล้วแต่ยังไม่ได้ส่ง พร้อมเวลาที่เหลือก่อนเลยเป้า 90 วิ
   แสดงอย่างเดียว ไม่เปลี่ยนกติกา · ล็อกความสูงกันหน้าโยก */
#inv{display:flex;gap:10px;align-items:center;background:var(--panel);margin:18px 4px 0;padding:6px 10px;height:74px;overflow:hidden;
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)}
.slot{width:52px;height:52px;flex:none;background:#e9d7a8;display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:inset 0 0 0 3px var(--ink),inset 4px 4px 0 0 rgba(0,0,0,.12)}
.slot .spr{width:80%;height:80%}
.slot .n{position:absolute;right:3px;bottom:2px;font:10px 'Press Start 2P',monospace;color:#fff;background:var(--ink);padding:1px 2px}
.rcpt{width:46px;height:58px;flex:none;background:#fff6d8;position:relative;text-align:center;font:8px/1.4 'Press Start 2P',monospace;
  box-shadow:inset 0 0 0 2px var(--ink);padding-top:3px}
.rcpt .spr{width:22px;height:22px;margin:0 auto}
.rcpt .tm{display:block;margin-top:2px;padding:1px 0;color:#fff}
.inv-label{font:600 12px 'Mitr',sans-serif;color:var(--ink-soft);writing-mode:horizontal-tb;flex:none}
.receipts{display:flex;gap:6px;overflow:hidden;flex:1}
.hud{min-height:44px;flex-wrap:nowrap} .hud .chip{white-space:nowrap}
.hud button{min-width:96px}
@media (max-width:600px){ #quest{height:140px} #act{height:150px} .hud{flex-wrap:wrap;min-height:90px} }

.wrap{position:relative;margin:18px auto;width:calc(var(--t) * var(--w))}
.map{display:grid;grid-template-columns:repeat(var(--w), var(--t));touch-action:manipulation;user-select:none;
  box-shadow:0 -6px 0 0 var(--ink),0 6px 0 0 var(--ink),-6px 0 0 0 var(--ink),6px 0 0 0 var(--ink),10px 10px 0 0 rgba(0,0,0,.4)}
.tile{width:var(--t);height:var(--t);position:relative;cursor:pointer;image-rendering:pixelated;background-size:100% 100%;
  display:flex;align-items:center;justify-content:center}
.tile:hover{outline:2px dashed rgba(255,255,255,.7);outline-offset:-3px}
.tile.mark::after{content:'';position:absolute;inset:30%;background:rgba(122,85,32,.25)}
.spr{display:block;width:88%;height:88%;background-size:100% 100%;image-rendering:pixelated;image-rendering:crisp-edges}
/* ป้ายชื่อใต้ sprite: กว้างตามข้อความ จัดกลางช่อง ล้นออกนอกช่องได้ ไม่ถูกตัด (ผู้ใช้แจ้ง 11 พ.ย.)
   เดิม left:0 right:0 + overflow:hidden ชื่อยาวอย่าง "ราวออเดอร์" "กระทะทอด" โดนตัดครึ่ง */
.label{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);text-align:center;font:500 9px/1.35 'Mitr',sans-serif;color:#fff;
  background:var(--ink);white-space:nowrap;padding:0 3px;z-index:4;pointer-events:none}
.tile{overflow:visible}
/* ชั้นของที่ขยับ (ตัวละคร ป้าย แถบเวลา) ทับแผนที่ วาดใหม่ทุกเฟรมแยกจากพื้น ไม่ต้องวาดแผนที่ทั้งแผ่นใหม่ */
.dyn{position:absolute;inset:0;pointer-events:none}
.at{position:absolute;width:var(--t);height:var(--t)}
.goal{outline:4px solid #f5c542;outline-offset:-4px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{outline-color:#e0702e}}
.badge{position:absolute;top:0;right:0;background:var(--bad);color:#fff;font:9px/15px 'Press Start 2P',monospace;padding:0 3px;z-index:2;box-shadow:0 0 0 2px var(--ink)}
.prog{position:absolute;left:6%;right:6%;height:7px;background:#2b1d14;box-shadow:0 0 0 2px #000;z-index:3}
.prog i{display:block;height:100%;background:#7bd14a}
.prog.busy i{background:#f5c542}
.hero{position:absolute;width:var(--t);height:var(--t);display:flex;align-items:center;justify-content:center;transition:left .2s linear, top .2s linear;z-index:3}
.hero .spr{width:92%;height:92%}
.hero.bob .spr{transform:translateY(-3px)}
.hero .hand{position:absolute;right:-6%;top:-10%;width:46%;height:46%}
/* ของเสียกองอยู่ฝั่งซ้ายของจุด */
.at>.spr.hand.trash{right:auto;left:4%;bottom:28%}
.at>.spr.hand{position:absolute;right:4%;bottom:28%;width:44%;height:44%;animation:hop .6s steps(2) infinite}
.pointer{position:absolute;z-index:5;transform:translate(-50%,-100%);background:var(--accent);color:#fff;font:600 12px 'Mitr',sans-serif;
  padding:2px 8px;white-space:nowrap;animation:hop .6s steps(2) infinite;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
@keyframes hop{50%{margin-top:-4px}}
.float{position:absolute;z-index:6;pointer-events:none;animation:up 1s steps(8) forwards}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
.coin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:3px;background:var(--coin);color:#5a3a06;
  font:10px 'Press Start 2P',monospace;box-shadow:0 -3px 0 0 var(--coin-d),0 3px 0 0 var(--coin-d),-3px 0 0 0 var(--coin-d),3px 0 0 0 var(--coin-d),inset -3px -3px 0 0 rgba(0,0,0,.15)}
.jar{display:flex;flex-wrap:wrap;gap:4px}
.action{min-height:60px}
.big{font-size:26px;font-weight:600}
table{border-collapse:collapse;width:100%}
td,th{padding:6px;border-bottom:3px dotted var(--line);text-align:left}
.ok{color:var(--good);font-weight:600} .no{color:var(--bad);font-weight:600}
.pick{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:14px var(--px);cursor:pointer;background:var(--panel)}
.pick.on{background:var(--panel-2);box-shadow:0 -4px 0 0 var(--accent),0 4px 0 0 var(--accent),-4px 0 0 0 var(--accent),4px 0 0 0 var(--accent)}
.pick small{display:block;color:var(--ink-soft)}
.pick input{width:18px;height:18px;accent-color:var(--accent)}
select,input[type=text]{font:inherit;padding:6px 8px;margin:4px;background:#fff;color:var(--ink);max-width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:520px;width:100%}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;max-width:92vw;
  opacity:0;transition:opacity .2s steps(3);pointer-events:none;z-index:30;box-shadow:0 0 0 4px #000}
.toast.show{opacity:1}
.keys{font-size:13px;color:#e8e0c8}
.strip{display:flex;gap:10px;justify-content:center;align-items:center;margin:8px 0}
.strip .spr{width:48px;height:48px}
.strip b{font:600 18px 'Mitr',sans-serif}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ───────── ค่าตั้งต้น (หน่วยวินาที) ───────── */
const RULE = {
  shiftSec: 300,                 // กะละ 5 นาที (ผู้ใช้ขอ 11 พ.ย. หลังเพิ่ม 3 สินค้า + ราวออเดอร์ 3 นาทีแน่นเกิน)
  walk: 0.25,                    // เดิน 1 ช่อง
  dur: {fry:4, mill:3, pick:2, drop:1, take:1, load:2, dry:10, lift:1, pack:3, packSlow:5, grab:1, sign:4, send:1, search:3},
  onTime: 90,                    // เป้า: ส่งภายใน 90 วินาทีหลังร้านสั่ง (60 วิ บอตส่งทันแทบไม่ได้ในกะ 2 เพราะคนเดียวทำทีละถุง)
  wEvery: 30,                    // ทุก 30 วินาทีที่มีออเดอร์ค้างรอตาก = W 1 เหรียญ (15 วิ ได้ W 12 เหรียญ กลบตัวอื่นหมด)
  pack: 1, packLean: 1,          // เก็บกล้วยต่อเที่ยว (หวี) · ทีละหวี (ผู้ใช้ขอ 11 พ.ย.) เดิม 5 / ข้อ I 3
  // เวลาที่ออเดอร์เข้า กะ 2 จำนวนเท่าเดิม เวลาต่างไป
  // เวลาออเดอร์ยืดตามกะ 5 นาที (×5/3 จากชุด 3 นาที) จำนวนเท่าเดิม 8 ใบ
  orders1: [5,33,67,92,133,167,200,233], orders2: [5,25,58,100,125,167,208,242],
  // สินค้า 3 อย่างตามเคส Banana Land (ผู้ใช้ขอ 10 พ.ย.) · ทั้งสองกะ: ตาก 4 ฉาบ 2 แป้ง 2 สลับลำดับ · ใบแรกเป็นกล้วยตากให้บทสอนเหมือนเดิม
  // แป้งอยู่ลำดับ 2 เพราะเส้นทางยาวสุด (ตาก+บด) ถ้าเข้าทีหลัง บอตกะ 1 ไม่เคยทำแป้งเสร็จทันจบกะ น้องจะไม่เคยเห็นเครื่องบด
  // ตัดแป้งกล้วยออก (ผู้ใช้ขอ 11 พ.ย.) · ช่องที่เคยเป็นแป้งแทนด้วยกล้วยตาก ภาระลานตากเท่าเดิม แค่ไม่ต้องไปบด
  prod1: ['dried','dried','chips','dried','chips','dried','dried','dried'],
  prod2: ['dried','dried','chips','dried','chips','dried','dried','dried'],
  ideaAt: 100, staffAt: 150, staffLoss: 6, moveEach: 2,
  // เงิน (ตัวเลขสมมติ ควรแทนด้วยตัวเลขชุดเดียวกับฐานต้นทุน) · critique 10 พ.ย. ข้อ 1 และ 3
  budget: 200, bagPrice: 40, coinCost: 5,    // งบเท่ากันทุกกลุ่ม · ส่งทัน 1 ถุง +40 ฿ · เหรียญละ 5 ฿ (10 ฿ ทำให้กะ 1 ขาดทุน −200 ทุกโต๊ะ ดูท้อ)
  ahead: 2, rotEvery: 45, rotKeep: 2, tableCap: 2,
  // ของเสียเกิดจากผู้เล่นเท่านั้น (ผู้ใช้ขอ 11 พ.ย.): ตากเสร็จแล้วไม่ยกภายใน burnDry วิ = ไหม้ · ทอดเสร็จแล้วไม่ตักภายใน burnFry วิ = ไหม้
  burnDry: 15, burnFry: 5,
  // M จากเดินผ่านลังได้ไม่เกิน 1 เหรียญต่อ markGap วิ (11 พ.ย.) · เดิมทุกเที่ยว พอมีงานเดินเพิ่ม (ถาด ขยะ โต๊ะ) M ขึ้นไป 11 เหรียญ ท่วมตัวอื่น
  markGap: 60, stockEvery: 30
};
// เรียงตาม DOWNTIME · คีย์ข้างในยังเป็น O1/O2/S: O1 = Extra-processing (E) · O2 = Overproduction (O) · S = Non-utilized talent (N)
const COINS = ['D','O2','W','S','T','I','M','O1'];
const LABEL = {T:'T',I:'I',M:'M',W:'W',O1:'E',O2:'O',D:'D',S:'N'};
const MEAN = {
  T:['Transportation','ขนย้ายของเกินจำเป็น'], I:['Inventory','ของค้าง ของเหลือ'], M:['Motion','เดินหรือขยับเกินจำเป็น'],
  W:['Waiting','รอคอย'], O1:['Extra-processing','ขั้นตอนที่ลูกค้าไม่เห็นค่า'], O2:['Overproduction','ผลิตก่อนมีคนสั่ง'],
  D:['Defects','ทำผิด ต้องทำใหม่'], S:['Non-utilized talent','ไม่ได้ใช้ไอเดียของคน']
};
const FIX = {
  T:['shelf','ตัดจุดพักกลางทาง','ไม่มีชั้นพัก ตากเสร็จไปจุดแพ็กเลย','—'],   // ย้ายของเองได้ในหน้าจัดร้าน ข้อนี้เหลือแค่ตัดจุดพัก
  M:['crate','ทุกอย่างมีที่ประจำ','เก็บลังที่เกะกะ สลับมาทอดไม่ต้องรื้อหาตะหลิว','—'],
  W:['yard','เกลี่ยงานที่คอขวด','ลานตากตากได้ 2 ถาดพร้อมกัน',`คนไปช่วยตาก แพ็กช้าลงเป็น ${RULE.dur.packSlow} วินาที`],
  O1:['boss','ตัดขั้นที่ลูกค้าไม่เห็นค่า','ไม่ต้องให้ประธานเซ็น','—'],
  O2:['order','ทำเมื่อมีคนสั่ง','ประธานเลิกสั่งตากเผื่อ ตาก/ทอดเฉพาะที่มีออเดอร์','ทำเผื่อไม่ได้'],
  I:['banana','เอาเท่าที่ใช้',`เก็บกล้วยครั้งละ ${RULE.packLean} หวี`,'ต้องไปเก็บบ่อยขึ้น'],

function layout(forTwo){
  const two = forTwo ?? s.shift===2, f = s.fixes, tidy = two && f.has('M');
  const base = two ? s.layout : START;
  const at = {...Object.fromEntries(Object.entries(base).map(([k,v])=>[k,v.slice()]))};
  if(two && f.has('T')) at.shelf = null;
  if(two && f.has('O1')) at.boss = null;
  const crates = tidy ? [] : [[3,2],[3,3],[3,4],[3,5],[9,2],[9,3],[9,4],[9,5],[6,1],[6,7]];

  const marks = tidy ? [] : [[2,3],[4,5],[10,2],[8,5]];
  return {at, crates, marks};
}

function money(){
  const ok = s.delivered.filter(b=>b.ok).length, coins = Object.values(s.coins[s.shift-1]).reduce((a,b)=>a+b,0);
  const inc = ok*RULE.bagPrice, loss = coins*RULE.coinCost, buy = two() ? spent() : 0;
  return {ok, coins, inc, loss, buy, profit: inc - loss - buy};
}

  toast(`ส่งทัน ${m.ok} ถุง +${m.inc}฿ · เหรียญ ${m.coins} อัน −${m.loss}฿${m.buy?` · ซื้อของ −${m.buy}฿`:''} = ${m.profit}฿`); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove('show'),2200); }

/* ───────── เวลา ─────────
   update(dt) เดินสถานะไปข้างหน้า dt วินาที เรียกจากลูปทุก 0.1 วินาที
   แยกจากการวาด เพื่อให้บอตทดสอบเร่งเวลาได้โดยไม่ต้องรอจริง */
function busyFor(d, label, then){ s.busy = {start:s.t, end:s.t+d, label, then}; s.mTrip = false; }
function update(dt){
  if(screen!=='play' || s.paused || s.modal) return;
  s.t += dt;
  // ออเดอร์เข้าตามเวลา
  const sched = two() ? RULE.orders2 : RULE.orders1;
  const prods = two() ? RULE.prod2 : RULE.prod1;
  while(s.oi < sched.length && sched[s.oi] <= s.t){ const pr = prods[s.oi]; s.pending.push({id:s.nextId++, t:sched[s.oi], prod:pr}); s.oi++; log(`ร้านของฝากสั่ง${PROD[pr].n} 1 ถุง`); }
  // งานติดตัว
  if(s.busy && s.t >= s.busy.end){ const b=s.busy; s.busy=null; if(b.then) b.then(); }
  // เดิน
  if(!s.busy && s.path.length){
    s.moveAcc += dt;
    const wk = RULE.walk * (two() && s.equip.has('cart') ? 0.6 : 1);
    while(s.moveAcc >= wk && s.path.length){ s.moveAcc -= wk; step(s.path.shift()); }
  } else s.moveAcc = 0;
  matchSpare();
  // งานเครื่อง: ลานตาก
  for(const j of s.jobs.filter(j=>s.t>=j.end)){
    s.jobs.splice(s.jobs.indexOf(j),1);
    if(j.bad){
      litter('yard'); s.tickets.unshift(j.order);
      floatAt(L.at.yard, `<span style="display:inline-block;width:44px;height:44px">${sp('bad')}</span>`);
      toast('กล้วยตากไหม้ดำ! เก็บไปทิ้งที่ถังขยะก่อน ลานตากถึงจะใช้ต่อได้');
    } else s.yardDone.push({order:j.order, signed:false, prod:j.prod, mill:false, rested:!L.at.shelf, doneAt:j.end});   // ตากเสร็จแล้วค้างบนลาน ต้องเดินมายกเอง (เดิมวาปไปชั้นพักเอง)
  }
  // ไหม้เพราะปล่อยไว้นาน (11 พ.ย.) · บทสอนไม่ไหม้ · มีข้อ D (กันพลาดที่เครื่อง) ไม่ไหม้
  if(!s.tut && !has('D')){
    const burnt = s.yardDone.filter(c=>s.t >= c.doneAt + RULE.burnDry);
    if(burnt.length){ s.yardDone = s.yardDone.filter(c=>!burnt.includes(c));
      for(const c of burnt){ litter('yard'); drop('D','ตากเสร็จแล้วไม่ยก ปล่อยจนไหม้'); if(c.order) s.tickets.unshift(c.order); }
      floatAt(L.at.yard, `<span style="display:inline-block;width:44px;height:44px">${sp('bad')}</span>`);
      toast('ปล่อยถาดไว้บนลานนานเกิน ไหม้ดำ! เก็บไปทิ้งก่อน ลานถึงจะใช้ต่อได้'); }
    if(s.pan && s.t >= s.pan.end + RULE.burnFry){ litter('fryer'); drop('D','ทอดเสร็จแล้วไม่ตัก ปล่อยจนไหม้'); if(s.pan.order) s.tickets.unshift(s.pan.order); s.pan=null;
      floatAt(L.at.fryer, `<span style="display:inline-block;width:44px;height:44px">${sp('bad')}</span>`);
      toast('กล้วยฉาบค้างในกระทะนานเกิน ไหม้! เก็บไปทิ้งก่อน กระทะถึงจะใช้ต่อได้'); }
  }
  // W: ทุก 15 วินาทีที่ยังมีออเดอร์รอตาก
  // W: ทุก 30 วินาที ถ้ามีออเดอร์ที่รอมาเกิน 30 วินาทีแล้วยังไม่ได้ลงลานตาก
  // เดิมนับแค่ "มีออเดอร์ค้าง" ซึ่งเกือบทุกจังหวะมีอยู่แล้ว W เลยได้ 6 เหรียญทุกกะไม่ว่าจะปรับอะไร
  // นับตั้งแต่ใบเข้ามือ ไม่ใช่ตอนแขวน (แก้ 11 พ.ย.): ใบที่ค้างโต๊ะหรือค้างในมือ ลูกค้าก็รออยู่ดี · ใบที่ยังไม่รับไม่นับ
  // ถ้านับตอนแขวน การรับรวดเดียวทุกใบจะดูไม่มีต้นทุน ทั้งที่ใบหลัง ๆ รอในมือนาน
  // I ระหว่างกะ (11 พ.ย.): กล้วยกองที่ลานเกิน RULE.rotKeep หวีนานเกินไปจะงอม ทุก 45 วินาทีทิ้ง 1 หวี
  // เดิม I เกิดแค่ตอนจบกะจากของเหลือ พอกะยาว 5 นาที ของใช้หมดก่อนจบ I แทบเป็น 0 · ข้อ "เอาเท่าที่ใช้" ลด I นี้ได้
  if(s.t >= s.nextRot){ if(s.stock > RULE.rotKeep){ s.stock--; litter('yard');
      floatAt(L.at.yard, `<span style="display:inline-block;width:30px;height:30px">${sp('banana')}</span>`); drop('I','กล้วยกองไว้นานจนงอม ทิ้ง 1 หวี'); }
    s.nextRot += RULE.rotEvery; }
  // I กลับมา (11 พ.ย.): ของที่ทำเผื่อไว้แต่ยังไม่มีคนสั่ง ค้างอยู่ตรงไหนก็ตาม ทุก stockEvery วิ นับ 1 เหรียญต่อชิ้น
  // เก็บกล้วยทีละหวีแล้วกล้วยไม่เคยกองจนงอม I หายไป · ต้นเหตุคือตากเผื่อ (O) = Overproduction ทำให้เกิด Inventory
  if(s.t >= s.nextStock){
    const handSpare = s.hand && s.hand.items ? s.hand.items.filter(c=>c.prod && !c.order).length : 0;
    const spare = [...s.yardDone,...s.shelf,...s.packIn,...s.ready,...tableItems('tray'),...tableItems('bag')].filter(c=>!c.order).length + handSpare;
    if(spare){ for(let i=0;i<spare;i++) drop('I','ของทำเผื่อค้างสต็อก ยังไม่มีคนสั่ง'); floatAt(L.at.yard, `<b style="color:#c2452f">ค้างสต็อก ${spare}</b>`); }
    s.nextStock += RULE.stockEvery; }
  if(s.t >= s.nextW){ const late = [...s.tickets, ...(handIs('ticket')?s.hand.items:[]), ...tableItems('ticket')].filter(o=>s.t-o.t > RULE.wEvery).length;
    if(late) drop('W',`ออเดอร์รอเกิน ${RULE.wEvery} วิ ${late} ใบ`);
    // W ที่เคาน์เตอร์ (ผู้ใช้ขอ 11 พ.ย.): ใบที่ยังไม่มีใครรับเกิน 30 วิ ลูกค้ายืนรอ · ส่วนนาฬิกา 90 วิ ยังเริ่มตอนรับ
    const idle = s.pending.filter(o=>s.t-o.t > RULE.wEvery).length;
    if(idle){ drop('W',`ลูกค้ารอที่เคาน์เตอร์ ยังไม่มีใครรับใบสั่ง ${idle} ใบ`); floatAt(L.at.order, '<b style="color:#c2452f">รอนาน!</b>'); }
    s.nextW += RULE.wEvery; }
  // เหตุการณ์กลางกะ (หยุดนาฬิกา)
  if(!two() && !s.ideaAsked && s.t >= RULE.ideaAt){ s.ideaAsked = true; s.modal = 'idea'; render(); }
  if(two() && !s.staffShown && s.t >= RULE.staffAt){ s.staffShown = true; s.modal = 'staff'; render(); }
  if(s.t >= RULE.shiftSec) endShift();
}

/* ───────── เดิน ───────── */
function blocked(x,y){ return x<0||y<0||x>=W||y>=H||L.crates.some(([a,b])=>a===x&&b===y); }
function path(from,to){
  const q=[from], prev={[key(...from)]:null};
  while(q.length){ const [x,y]=q.shift(); if(x===to[0]&&y===to[1]) break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(!blocked(nx,ny) && !(k in prev)){ prev[k]=[x,y]; q.push([nx,ny]); } } }
  if(!(key(...to) in prev)) return null;
  const out=[]; let c=to; while(c && key(...c)!==key(...from)){ out.unshift(c); c=prev[key(...c)]; }
  return out;
}
function step(to){
  s.pos = to; s.moved = true; s.trail.push(to);
  // M จากลังเกะกะ นับ 1 ครั้งต่อเที่ยวเดิน (ระหว่างงานสองอย่าง)
  if(L.marks.some(([a,b])=>a===to[0]&&b===to[1]) && !s.mTrip && s.t >= (s.nextMark||0)){ s.mTrip = true; s.nextMark = s.t + RULE.markGap; drop('M','เดินอ้อมลังเกะกะ'); }
}
function walkTo(to){ if(s.busy || s.modal) return; const p = path(s.pos,to); if(p) s.path = p; }
function nudge(dx,dy){ if(s.busy || s.modal) return; const nx=s.pos[0]+dx, ny=s.pos[1]+dy; if(!blocked(nx,ny)) s.path=[[nx,ny]]; }
function hereStation(){ if(s.path.length) return null; for(const k in L.at){ const p=L.at[k]; if(p && p[0]===s.pos[0] && p[1]===s.pos[1]) return k; } return null; }

/* ───────── งานที่แต่ละจุด ───────── */
const handIs = k => s.hand && s.hand.kind===k;
// ของเสีย (ผู้ใช้ขอ 11 พ.ย.): เกิดที่ไหนกองอยู่ที่นั่น ต้องเก็บไปทิ้งที่ถังขยะเอง · ลานตาก/กระทะที่มีของเสียกองใช้ต่อไม่ได้
/* M ไม่สุ่มแล้ว (ผู้ใช้ขอ 11 พ.ย.): ของไม่มีที่ประจำ สลับจากตากไปทอด (หรือกลับ) ต้องรื้อหาเครื่องมือ 3 วิ
   ผู้เล่นคุมได้: ทอดกล้วยฉาบติดกันทีเดียว = หาน้อยลง · ข้อ M (ทุกอย่างมีที่ประจำ) ไม่ต้องหาเลย */
function toolSearch(tool, name){
  const sw = s.lastTool && s.lastTool !== tool; s.lastTool = tool;
  if(!name || !sw || has('M')) return 0;   // หาเฉพาะตะหลิว (สลับจากตากมาทอด) · เดิมนับทั้งสองทาง M ได้ 13+ เหรียญ ท่วมตัวอื่น
  drop('M',`สลับงาน ต้องรื้อหา${name}`); floatAt(s.pos, `<span class="chip" style="background:#c2452f">หา${name}…</span>`);
  return RULE.dur.search;
}
/* จับคู่ใบสั่งที่แขวนแล้วกับของที่ทำไว้ก่อน (ไม่มีเจ้าของ) ทุกจังหวะ ไม่ว่าของอยู่ตรงไหน
   บัค 11 พ.ย.: ตากก่อนแขวนใบ ถาดยังอยู่บนลานตอนแขวน เลยไม่ถูกจับคู่ ถุงไม่มีเจ้าของ หยิบไปส่งไม่ได้จนรับใบที่ 2 */
function matchSpare(){
  for(let i=0; i<s.tickets.length; i++){
    const o = s.tickets[i];
    const job = s.jobs.find(j=>!j.order && !j.bad && j.prod===o.prod) || (s.pan && !s.pan.order && o.prod==='chips' ? s.pan : null);   // กล้วยฉาบที่ทอดเผื่ออยู่ในกระทะ
    const item = job ? null : [...s.yardDone, ...(handIs('tray')?s.hand.items:[]), ...tableItems('tray'), ...s.shelf, ...s.packIn, ...s.ready, ...tableItems('bag')]
      .find(c=>!c.order && c.prod===o.prod);
    if(!job && !item) continue;
    if(job) job.order = o; else item.order = o;
    s.tickets.splice(i--, 1); log('ใช้ของที่ทำไว้ก่อน');
  }
}
function litter(st){ s.trash[st] = (s.trash[st]||0) + 1; }
const trashSpots = () => Object.keys(s.trash).filter(k=>s.trash[k]>0);
const KIND_N = {bad:'ของเสีย', banana:'กล้วย', tray:'ถาด', bag:'ถุง', ticket:'ใบออเดอร์'};
const tableItems = k => s.table.filter(h=>h.kind===k).flatMap(h=>h.items||[]);
// D: ใบสั่งเขียนมือ อ่านผิดทุกใบที่ 3 ที่ผลิต (ไม่สุ่ม) · เดิมสุ่ม 1 ใน 6 บางรอบไม่เจอ D เลย น้องจะไม่รู้จักเหรียญนี้
function misread(){ if(has('D')) return false; s.made = (s.made||0) + 1; return s.made % 3 === 0; }
// ประธานสั่งตากเผื่อเฉพาะกะ 1 · ลองให้สั่งในกะ 2 ด้วย (tuning pass 11 พ.ย.) แต่ออเดอร์ส่วนใหญ่เป็นกล้วยตาก ถาดเผื่อขายได้หมด
// ตากเผื่อเลยได้กำไรมากกว่า (185 vs 160 ฿) สอนกลับด้าน จึงคงไว้กะ 1 และซ่อนข้อ O ในร้าน
const bossAhead = () => !two() && !s.tut;
const slots = () => 1 + (has('W')?1:0) + (two() && s.equip.has('dryer2')?1:0);
function actions(){
  const here = hereStation(), A = [];
  if(s.busy) return {here, A};
  const add = (label, fn, ok=true) => A.push({label, fn, ok});
  const D = RULE.dur;
  if(here && s.trash[here]) add(`เก็บของเสีย (${s.trash[here]})`, ()=>busyFor(D.grab,'เก็บของเสีย',()=>{ s.hand={kind:'bad', n:s.trash[here]}; delete s.trash[here]; }), !s.hand);
  if(here==='bin') add(`ทิ้งลงถัง (${handIs('bad')?s.hand.n:0})`, ()=>busyFor(D.drop,'ทิ้งของเสีย',()=>{ s.waste += s.hand.n; s.hand=null; }), handIs('bad'));
  if(here==='garden'){
    const n = has('I') ? RULE.packLean : RULE.pack;
    add(`เก็บกล้วย ${n} หวี (${D.pick} วิ)`, ()=>busyFor(D.pick,'เก็บกล้วย',()=>{ s.hand={kind:'banana', n}; if(Math.abs(L.at.garden[0]-L.at.yard[0])+Math.abs(L.at.garden[1]-L.at.yard[1]) > 3) drop('T','แบกกล้วยจากสวนไกล'); }), !s.hand);
  }
  if(here==='order'){
    // รับแล้วใบสั่งอยู่ในมือ ต้องเดินไปแขวนที่ราวก่อน ครัวถึงจะเห็น (ผู้ใช้ขอ 10 พ.ย.)
    // รับได้หลายใบรวดเดียว ถ้ามือว่างหรือถือใบสั่งอยู่แล้ว
    // เลือกได้ว่าจะรับกี่ใบ (ผู้ใช้ขอ 11 พ.ย.): รับทีละใบ = เดินไปแขวนบ่อย · รับรวดเดียว = ใบหลัง ๆ รอนานในมือ
    const canTake = !s.hand || handIs('ticket'), np = s.pending.length;
    const take = n => busyFor(D.take,'รับออเดอร์',()=>{
      // เวลาออเดอร์เริ่มเดินตอนใบเข้ามือ (ผู้ใช้ขอ 11 พ.ย.) · เก็บเวลาที่ร้านสั่งจริงไว้ที่ o.placed
      const got = s.pending.splice(0, n); got.forEach(o=>{ o.placed = o.t; o.t = s.t; }); if(handIs('ticket')) s.hand.items.push(...got); else s.hand={kind:'ticket', items:got}; });
    if(!np) add('รับออเดอร์', ()=>{}, false);
    for(let n=1; n<=Math.min(np,3); n++) add(n===np ? `รับทั้งหมด ${n} ใบ` : `รับ ${n} ใบ`, ()=>take(n), canTake);
    if(np>3) add(`รับทั้งหมด ${np} ใบ`, ()=>take(np), canTake);
  }
  if(here==='rail'){
    add(`แขวนออเดอร์ (${handIs('ticket')?s.hand.items.length:0})`, ()=>busyFor(D.drop,'แขวนออเดอร์',()=>{
      for(const o of s.hand.items){
        o.hung = s.t;   // ไว้แยกสีใบที่ยังไม่แขวน · เวลาเป้านับจากตอนลูกค้าสั่ง (o.t)
        s.tickets.push(o);   // จับคู่กับของที่ทำไว้ก่อนใน matchSpare()
      }
      s.hand=null; }), handIs('ticket'));
  }
  if(here==='yard'){
    if(handIs('banana')) add('วางกล้วย', ()=>busyFor(D.drop,'วางกล้วย',()=>{ s.stock+=s.hand.n; s.hand=null; }));
    if(s.yardDone.length) add(`ยกถาดที่ตากเสร็จ (${s.yardDone.length})`, ()=>{ const items = s.yardDone; s.yardDone = []; busyFor(D.grab,'ยกถาดลงจากลาน',()=>{ s.hand={kind:'tray', items}; }); }, !s.hand);
    const free = s.jobs.length < slots() && !s.trash.yard;
    const load = (ahead) => {
      const extra = 0;
      toolSearch('knife');   // มีดใช้ที่ลานตลอด ไม่ต้องหา แค่จำว่าเครื่องมือล่าสุดคืออะไร
      busyFor(D.load+extra, ahead?'ตากเผื่อ':'ใส่กล้วยลงลานตาก', ()=>{
        s.stock--;
        if(ahead){ s.ahead++; drop('O2','ตากไว้ก่อนมีคนสั่ง'); s.jobs.push({order:null, prod:'dried', bad:false, end:s.t+D.dry, start:s.t}); return; }
        const ti = s.tickets.findIndex(o=>o.prod!=='chips'); const o = ti>=0 ? s.tickets.splice(ti,1)[0] : null;
        if(!o){ drop('O2','ตากไว้ก่อนมีคนสั่ง'); }
        s.jobs.push({order:o, prod:o?o.prod:'dried', bad:false, end:s.t+D.dry, start:s.t});
      });
    };
    if(bossAhead() && s.ahead < RULE.ahead) add('ตากเผื่อตามที่ประธานสั่ง', ()=>load(true), s.stock>0 && free);
    add(`ตาก 1 ถาด (${D.dry} วิ)`, ()=>load(false), s.stock>0 && free && (s.tickets.some(o=>o.prod!=='chips') || !has('O2')));
  }
  if(here==='fryer'){
    // ทอดเป็นงานเครื่อง (11 พ.ย.): ใส่กระทะแล้วไปทำอย่างอื่นได้ แต่ต้องกลับมาตักภายใน burnFry วิ ไม่งั้นไหม้
    if(s.pan && s.t >= s.pan.end) add('ตักกล้วยฉาบขึ้น', ()=>{ const p = s.pan; s.pan = null;   // ยกออกจากไฟทันทีที่กด กันไหม้ระหว่างตัก
      busyFor(D.grab,'ตักกล้วยฉาบ',()=>{ s.hand={kind:'tray', items:[{order:p.order, signed:false, prod:'chips', mill:false, rested:!L.at.shelf}]}; }); }, !s.hand);
    // บัค 11 พ.ย.: เดิมใช้ได้แค่กล้วยที่วางไว้ที่ลานตาก ถือกล้วยจากสวนมาตรงกระทะแล้วกดไม่ได้ และไม่บอกเหตุผล
    // ตอนนี้ใช้กล้วยในมือก่อน ถ้ามือว่างค่อยใช้กล้วยที่ลาน · ปุ่มกดไม่ได้จะบอกว่าขาดอะไร
    const inHand = handIs('banana'), hasBanana = inHand || s.stock>0, hasOrder = s.tickets.some(o=>o.prod==='chips');
    // ทอดเผื่อได้แม้ไม่มีออเดอร์ (ผู้ใช้ขอ 11 พ.ย.) = O เหมือนตากเผื่อ · มีข้อ O (ทำเมื่อมีคนสั่ง) ถึงจะทอดเผื่อไม่ได้
    const why = s.pan ? 'กระทะยังไม่ว่าง' : s.trash.fryer ? 'ทิ้งของไหม้ก่อน' : (!hasOrder && has('O2')) ? 'ทำเมื่อมีคนสั่งเท่านั้น'
      : !hasBanana ? 'ไม่มีกล้วย ไปเก็บที่สวน' : (s.hand && !inHand) ? 'มือไม่ว่าง' : '';
    add(why ? `ทอดกล้วยฉาบ (${why})` : hasOrder ? `ทอดกล้วยฉาบ (${D.fry} วิ)` : `ทอดเผื่อ ยังไม่มีคนสั่ง (${D.fry} วิ)`, ()=>{
      const extra = toolSearch('spatula','ตะหลิว');
      const fromHand = handIs('banana');
      if(fromHand){ s.hand.n--; if(s.hand.n<=0) s.hand=null; } else s.stock--;   // หยิบกล้วยตอนกด กันกล้วยหายระหว่างรอ
      busyFor(D.load+extra,'ใส่กล้วยลงกระทะ',()=>{
        const ti = s.tickets.findIndex(o=>o.prod==='chips'); const o = ti>=0 ? s.tickets.splice(ti,1)[0] : null;
        if(!o) drop('O2','ทอดไว้ก่อนมีคนสั่ง');
        s.pan = {order:o, start:s.t, end:s.t+D.fry};
      }); }, !why);
  }
  if(here==='table'){
    // วางของในมือพักไว้ได้ 2 อย่าง หยิบคืนอันไหนก็ได้ (มือต้องว่าง)
    if(s.hand) add(`วางบนโต๊ะ (${KIND_N[s.hand.kind]})`, ()=>busyFor(D.drop,'วางของบนโต๊ะ',()=>{ s.table.push(s.hand); s.hand=null; }), s.table.length < RULE.tableCap);
    s.table.forEach((h,i)=>add(`หยิบ${KIND_N[h.kind]}จากโต๊ะ`, ()=>busyFor(D.drop,'หยิบของจากโต๊ะ',()=>{ s.hand = s.table.splice(i,1)[0]; }), !s.hand));
  }
  if(here==='shelf'){
    // กะ 1 ประธานสั่งให้พักถาดบนชั้นก่อนแพ็ก = ยกขึ้นยกลงเพิ่ม 1 รอบ (T) · ตัดได้ด้วยข้อ "ตัดจุดพักกลางทาง"
    const raw = handIs('tray') ? s.hand.items.filter(c=>!c.rested).length : 0;
    if(raw) add(`วางพักบนชั้น (${raw})`, ()=>busyFor(D.drop,'วางพักบนชั้น',()=>{ s.hand.items.forEach(c=>c.rested=true); s.shelf.push(...s.hand.items); s.hand=null; if(Math.abs(L.at.shelf[0]-L.at.yard[0])+Math.abs(L.at.shelf[1]-L.at.yard[1]) > 3) drop('T','ยกถาดข้ามโรงเรือน'); }));
    add(`ยกถาด (${s.shelf.length})`, ()=>busyFor(D.lift,'ยกถาด',()=>{ s.hand={kind:'tray', items:s.shelf}; s.shelf=[]; }), !s.hand && s.shelf.length>0);
  }
  if(here==='pack'){
    if(handIs('tray')){ const unrested = s.hand.items.some(c=>!c.rested);
      add(unrested ? 'วางถาด (ต้องพักที่ชั้นก่อน)' : 'วางถาด', ()=>busyFor(D.drop,'วางถาด',()=>{ s.packIn.push(...s.hand.items); s.hand=null; }), !unrested); }
    const pd = has('W') ? D.packSlow : D.pack;
    add(`แพ็ก 1 ถุง (${pd} วิ)`, ()=>busyFor(pd,'แพ็ก',()=>{ const i=s.packIn.findIndex(c=>!c.mill); s.ready.push(s.packIn.splice(i,1)[0]); }), s.packIn.some(c=>!c.mill));
    // ถุงที่ทำเผื่อ (ยังไม่มีออเดอร์) หยิบไปส่งไม่ได้ · บอกเหตุผลบนปุ่ม (บัค 11 พ.ย. ผู้เล่นงงว่าทำไมหยิบถุงฉาบไม่ได้)
    const nOk = s.ready.filter(c=>c.order).length, nSpare = s.ready.length - nOk;
    const sp0 = s.ready.find(c=>!c.order), spName = sp0 ? PROD[sp0.prod].n : '';
    const pickWhy = s.hand && nOk ? 'มือไม่ว่าง' : !nOk && nSpare ? `${spName}ถุงนี้ยังไม่มีคนสั่ง รอออเดอร์${spName}แล้วแขวนที่ราว` : '';
    if(nOk || nSpare) add(pickWhy ? `หยิบถุงไปส่ง (${pickWhy})` : `หยิบถุงไปส่ง (${nOk})`, ()=>busyFor(D.grab,'หยิบถุง',()=>{
      s.hand={kind:'bag', items:s.ready.filter(c=>c.order)}; s.ready=s.ready.filter(c=>!c.order); }), !pickWhy && nOk>0);
  }
  if(here==='boss' && !has('O1')){
    const n = handIs('bag') ? s.hand.items.filter(b=>!b.signed).length : 0;
    add(n ? `ขอลายเซ็น (${n*D.sign} วิ)` : handIs('bag') ? 'ขอลายเซ็น (เซ็นครบแล้ว ไปส่งได้)' : 'ขอลายเซ็น (ถือถุงที่แพ็กแล้วมาก่อน)', ()=>{ for(let i=0;i<n;i++) drop('O1','รอประธานเซ็น');
      busyFor(n*D.sign,'รอประธานเซ็น',()=>s.hand.items.forEach(b=>b.signed=true)); }, n>0);
  }
  if(here==='send'){
    add('ส่งของ', ()=>{
      const need = !has('O1');
      if(need && s.hand.items.some(b=>!b.signed)){ toast('ประธานยังไม่ได้เซ็น'); return; }
      busyFor(D.send*s.hand.items.length,'ส่งของ',()=>{
        for(const b of s.hand.items){
          // ตัดการส่งผิดรสแบบสุ่มออก (11 พ.ย.) ของเสียต้องเกิดจากการกระทำของผู้เล่นเท่านั้น
          const wrong = false;
          b.ok = !wrong && (s.t - b.order.t) <= RULE.onTime; s.delivered.push(b);
          floatAt(s.pos, `<span class="chip" style="background:${b.ok?'#2f8a3e':'#c2452f'}">${b.ok?`ทัน! +${RULE.bagPrice}฿`:wrong?'ผิดรส 0฿':'ช้า 0฿'}</span>`);
        }
        s.hand=null;
        if(s.tut){ s.tut=false;   // บทสอนไม่ไหม้ พอจบให้นับเวลาไหม้ใหม่จากตอนนี้ ไม่งั้นถาดที่ค้างอยู่ไหม้ทันที
          s.yardDone.forEach(c=>c.doneAt=Math.max(c.doneAt,s.t)); if(s.pan) s.pan.end=Math.max(s.pan.end,s.t);
          toast(`จบบทสอน! ประธานฝากมาว่า "ว่างเมื่อไรให้ตากเผื่อไว้ ${RULE.ahead} ถาด"`); }
      });
    }, handIs('bag'));
  }
  return {here, A};
}
function doAction(i){ const {A}=actions(); if(A[i] && A[i].ok){ A[i].fn(); live(true); } }

/* ───────── ภารกิจ / บทสอน ───────── */
function goal(){
  if(s.busy) return [null, `กำลัง${s.busy.label}… ${Math.ceil(s.busy.end - s.t)} วิ`];
  const unsigned = handIs('bag') && !has('O1') && s.hand.items.some(b=>!b.signed);
  if(unsigned) return ['boss','เอาถุงไปให้ประธานเซ็นก่อนส่ง'];
  if(handIs('bag')) return ['send','เอาถุงไปส่งที่รถ'];
  if(handIs('bad')) return ['bin','เอาของเสียไปทิ้งที่ถังขยะ'];
  if(handIs('ticket')) return ['rail',`เอาใบออเดอร์ ${s.hand.items.length} ใบไปแขวนที่ราว`];
  if(handIs('banana') && s.tickets.some(o=>o.prod==='chips') && !s.pan && !s.trash.fryer) return ['fryer','ถือกล้วยมาแล้ว เอาไปทอดกล้วยฉาบได้เลย'];
  if(handIs('banana')) return ['yard','เอากล้วยไปวางที่ลานตาก'];
  if(handIs('tray') && s.hand.items.some(c=>!c.rested)) return ['shelf','ประธานสั่ง: ถาดต้องพักที่ชั้นพักก่อนแพ็ก'];
  if(handIs('tray')) return ['pack','เอาถาดไปวางที่จุดแพ็ก'];
  const tr = trashSpots()[0];
  if(tr && !s.hand) return [tr, `มีของเสียกองที่${ST[tr]} เก็บไปทิ้งที่ถังขยะ`];
  // ของที่เสร็จแล้วและกำลังจะไหม้มาก่อน
  if(s.pan && s.t >= s.pan.end && !s.hand) return ['fryer', has('D') ? 'กล้วยฉาบทอดเสร็จแล้ว ไปตักขึ้น' : `กล้วยฉาบทอดเสร็จ! ไปตักก่อนไหม้ (เหลือ ${Math.max(0,Math.ceil(s.pan.end+RULE.burnFry-s.t))} วิ)`];
  // กำลังทอด (4 วิ) มือว่าง: ยืนรอที่กระทะ ถ้าเดินไปสวนกลับมาไม่ทัน ไหม้ทุกรอบ
  if(s.pan && s.t < s.pan.end && !s.hand && !has('D')) return ['fryer', `กำลังทอด รอตักอีก ${Math.ceil(s.pan.end - s.t)} วิ อย่าเดินไปไกล`];
  if(s.yardDone.length && !s.hand){ const d0 = Math.min(...s.yardDone.map(c=>c.doneAt)); return ['yard', has('D') ? 'ตากเสร็จแล้ว ไปยกถาดลงจากลานตาก' : `ตากเสร็จแล้ว ไปยกถาดก่อนไหม้ (เหลือ ${Math.max(0,Math.ceil(d0+RULE.burnDry-s.t))} วิ)`]; }
  // มือว่างแล้ว: ถ้าลานตาก (คอขวด) ว่างและมีออเดอร์รอตาก ให้เริ่มตากก่อนทำอย่างอื่น
  // เดิมลานตากอยู่ท้ายสุด พองานอื่นแทรกตลอด ออเดอร์แป้งไม่เคยได้ลงลานในกะ 1 · ตรงหลัก "อย่าให้คอขวดว่าง"
  const free0 = s.jobs.length < slots() && !s.trash.yard, yardT0 = s.tickets.some(o=>o.prod!=='chips');
  if(free0 && yardT0 && s.stock>0 && !(bossAhead() && s.ahead===0)) return ['yard',`ลานตากว่าง ตากตามออเดอร์ก่อน`];
  // เก็บกล้วยทีละหวีแล้วกล้วยที่ลานมักเป็น 0 กฎข้างบนเลยไม่เคยทำงาน ลานตาก (คอขวด) ว่างนาน · ให้ไปเก็บกล้วยมาป้อนลานก่อน
  if(free0 && yardT0 && s.stock===0 && !s.hand && !(bossAhead() && s.ahead===0)) return ['garden','ลานตากว่าง แต่ไม่มีกล้วย ไปเก็บมาตากก่อน'];
  if(s.table.length) return ['table','มีของวางพักไว้บนโต๊ะ ไปหยิบมาทำต่อ'];
  if(s.ready.some(c=>c.order)) return ['pack','หยิบถุงที่แพ็กแล้วไปส่ง'];
  if(s.packIn.some(c=>!c.mill)) return ['pack','แพ็กใส่ถุง'];
  if(s.shelf.length) return ['shelf','ยกถาดจากชั้นพัก'];
  const free = s.jobs.length < slots() && !s.trash.yard;
  // กะ 1: ประธานสั่งตากเผื่อ (ให้เหรียญ O เกิดกับตัวเอง)
  // ถาดเผื่อใบแรกแทรกคิวได้ (ให้ O เกิดแน่) ใบต่อไปทำเฉพาะตอนลานว่างไม่มีออเดอร์รอตาก
  // เดิมแทรกคิวทั้ง 2 ใบ พอมี 3 สินค้า ออเดอร์แป้งไม่เคยได้ลงลานตากในกะ 1 เลย
  const yardWaiting = s.tickets.some(o=>o.prod!=='chips');
  if(bossAhead() && s.ahead < RULE.ahead && free && (s.ahead===0 || !yardWaiting)){
    if(s.stock===0) return ['garden','ประธานสั่งให้ตากเผื่อ แต่กล้วยหมด ไปเก็บที่สวน'];
    return ['yard',`ประธานสั่ง: "ตากเผื่อไว้ก่อน เดี๋ยวก็มีคนสั่ง" (${s.ahead}/${RULE.ahead})`];
  }
  if(s.pending.length) return ['order',`มีออเดอร์ใหม่ ${s.pending.length} ใบ ไปรับก่อน`];
  if(s.tickets.length && s.stock===0) return ['garden','กล้วยหมด ไปเก็บที่สวน'];
  if(s.tickets.some(o=>o.prod==='chips') && s.stock>0 && !s.pan) return ['fryer','ออเดอร์กล้วยฉาบ ไปทอดที่กระทะ'];
  const yardT = s.tickets.filter(o=>o.prod!=='chips').length;
  if(yardT && free) return ['yard',`ตากกล้วยตามออเดอร์ (ค้าง ${yardT} ใบ)`];
  const j = s.jobs.length ? Math.ceil(Math.min(...s.jobs.map(j=>j.end)) - s.t) : 0;
  if(yardT) return [null,`ลานตากเต็ม รอกล้วยแห้งอีก ${j} วิ`];
  if(s.jobs.length) return [null,`รอกล้วยตากเสร็จอีก ${j} วิ`];
  return [null,'รอออเดอร์ถัดไป'];
}

const TUT_ORDER = ['walk','order','rail','garden','yardDrop','yard','wait','lift','shelfDrop','shelf','packDrop','pack','pick','boss','send'];
function tutBox(gk){
  let k;
  if(!s.moved) k='walk';
  else if(s.busy) k='busy';
  else if(!gk) k='wait';
  else if(gk!=='bin' && s.trash[gk] && !s.hand) k='trash';
  else if(gk==='yard') k = handIs('banana') ? 'yardDrop' : (s.yardDone.length && !s.hand) ? 'lift' : 'yard';
  else if(gk==='shelf') k = handIs('tray') ? 'shelfDrop' : 'shelf';
  else if(gk==='pack') k = handIs('tray') ? 'packDrop' : s.ready.some(c=>c.order) ? 'pick' : 'pack';
  else k = gk;
  const n = TUT_ORDER.indexOf(k);
  return `<div class="quest tut"><b>บทสอน ${n>=0?(n+1)+'/'+TUT_ORDER.length:''}</b><span class="big2">${TUT[k]}</span>
    ${s.tutCoin?'<small>เหรียญหล่น! ยังไม่ต้องรู้ว่าแปลว่าอะไร สังเกตไว้ว่าเกิดตอนทำอะไร</small>':''}</div>`;
}

function endShift(){
  const spare=[...s.yardDone,...s.shelf,...s.packIn,...s.ready,...tableItems('tray'),...tableItems('bag')].filter(c=>!c.order).length + s.jobs.filter(j=>!j.order).length;
  const left = s.stock + (handIs('banana')?s.hand.n:0) + s.table.filter(h=>h.kind==='banana').reduce((n,h)=>n+h.n,0);
  s.coins[s.shift-1].I += left + spare;
  if(left+spare) log(`I · จบกะ เหลือกล้วย ${left} หวี ถาดไม่มีคนสั่ง ${spare}`);
  const coins = Object.values(s.coins[s.shift-1]).reduce((a,b)=>a+b,0);
  const ok = s.delivered.filter(c=>c.ok).length, total=(two()?RULE.orders2:RULE.orders1).length;
  const buyCost = two() ? spent() : 0;
  s.stats[s.shift-1] = {ok, total, coins, left, spare, sent:s.delivered.length, buyCost,
    income: ok*RULE.bagPrice, waste: coins*RULE.coinCost, score: ok*RULE.bagPrice - coins*RULE.coinCost - buyCost};
  if(!two()) s.trail1 = s.trail.slice();
  screen = two() ? 'debrief' : 'pour'; render();
}

  const m=document.querySelector('.dyn'); if(!m||!p) return;
  const t=tileSize(); const d=document.createElement('div'); d.className='float'; d.innerHTML=html;
  d.style.left=(p[0]*t+t*.2)+'px'; d.style.top=(p[1]*t)+'px'; m.appendChild(d); setTimeout(()=>d.remove(),1000);

function tileSize(){ return Math.max(26, Math.min(58, Math.floor((Math.min(window.innerWidth,980)-40)/W))); }

/* หน้าเล่น: วาดพื้นแผนที่ครั้งเดียว แล้ว live() อัปเดตเฉพาะส่วนที่ขยับทุก 0.1 วินาที

const memo = {};
function put(id, html){ if(memo[id]!==html){ memo[id]=html; const el=document.getElementById(id); if(el) el.innerHTML=html; } }
function live(force){
  if(screen!=='play') return;
  if(force) for(const k in memo) delete memo[k];
  const t = tileSize(), left = Math.max(0, RULE.shiftSec - s.t);
  put('hud', `<span class="chip px">กะ ${s.shift}</span>
    <div class="timebar"><i style="width:${left/RULE.shiftSec*100}%"></i></div>
    <span class="chip px ${left<30?'warn':''}">${sec(left)}</span><span class="chip px" onclick="moneyInfo()" style="cursor:pointer;${money().profit<0?'background:#c2452f':''}" title="แตะดูรายละเอียด">${money().ok}ถุง ${money().profit}฿</span><span class="chip">กล้วย ${s.stock}</span>
    <button onclick="togglePause()">${s.paused?'▶ เล่นต่อ':'❚❚ หยุด'}</button>`);
  const [gk, gtext] = goal(), gp = gk && L.at[gk];
  put('quest', s.tut ? tutBox(gk) : `<div class="quest"><b>ภารกิจ ›</b><span>${gtext}</span></div>`);
  // ชั้นที่ขยับ
  const at = (p, inner, cls='') => `<div class="at ${cls}" style="left:${p[0]*t}px;top:${p[1]*t}px">${inner}</div>`;
  const badge = n => n ? `<span class="badge">${n}</span>` : '';
  let d = '';
  if(gp) d += at(gp,'','goal');
  const ab = L.at;
  d += at(ab.order, badge(s.pending.length));
  d += at(ab.yard, badge(s.tickets.length) + (s.yardDone.length ? sp('tray','spr hand') : '') + s.jobs.map((j,i)=>`<div class="prog" style="top:${4+i*10}px"><i style="width:${Math.min(100,(s.t-j.start)/(j.end-j.start)*100)}%"></i></div>`).join(''));

  const redBar = (from, span) => `<div class="prog" style="top:-6px"><i style="width:${Math.max(0,100-(s.t-from)/span*100)}%;background:#c2452f"></i></div>`;
  if(s.yardDone.length && !has('D')) d += at(ab.yard, redBar(Math.min(...s.yardDone.map(c=>c.doneAt)), RULE.burnDry));
  if(s.pan && ab.fryer) d += at(ab.fryer, sp('chips','spr hand') + (s.t < s.pan.end

    : has('D') ? '' : redBar(s.pan.end, RULE.burnFry)));
  if(ab.shelf) d += at(ab.shelf, badge(s.shelf.length));
  if(ab.table) d += at(ab.table, (s.table.length ? sp(s.table[s.table.length-1].kind,'spr hand') : '') + badge(s.table.length));
  d += at(ab.pack, badge(s.packIn.length + s.ready.length));
  const w = s.waste;   // นับเฉพาะที่เอามาทิ้งแล้ว
  for(const k of trashSpots()) if(ab[k]) d += at(ab[k], sp('bad','spr hand trash') + `<span class="badge" style="left:0;right:auto;background:#c2452f">${s.trash[k]}</span>`);
  d += at(ab.bin, `<div class="tile" style="width:100%;height:100%;cursor:default">${sp(w?'bad':'bin')}<span class="label">${ST.bin}</span>${badge(w)}</div>`);
  const hand = s.hand ? sp(s.hand.kind,'spr hand') : '';
  const signed = handIs('bag') && !has('O1') && s.hand.items.every(b=>b.signed) ? `<i class="spr hand" style="right:auto;left:-6%;background-image:url(${SPR.sign})"></i>` : '';
  const prog = s.busy ? `<div class="prog busy" style="top:-6px"><i style="width:${(s.t-s.busy.start)/(s.busy.end-s.busy.start)*100}%"></i></div>` : '';
  d += `<div class="hero ${(s.pos[0]+s.pos[1])&1?'bob':''}" style="left:${s.pos[0]*t}px;top:${s.pos[1]*t}px">${sp('hero')}${hand}${signed}${prog}</div>`;
  if(s.tut && (gp || !s.moved)){ const p = gp || [6,4]; d += `<div class="pointer" style="left:${(p[0]+.5)*t}px;top:${p[1]*t}px">${gp?'ที่นี่':'แตะช่องไหนก็ได้'}</div>`; }
  // .float ที่กำลังลอยอยู่ต้องไม่หาย: แยกไว้ใน layer ของตัวเอง
  const dyn = document.getElementById('dyn');
  if(dyn){ let base = dyn.querySelector('.base'); if(!base){ base=document.createElement('div'); base.className='base'; dyn.prepend(base); }
    if(memo.dyn!==d){ memo.dyn=d; base.innerHTML=d; } }
  // ปุ่มงาน
  const {here, A} = actions();
  put('act', `<b class="row" style="gap:6px">${s.busy?`กำลัง${s.busy.label}…`:here?`<span style="width:28px;height:28px;display:inline-block">${sp(here)}</span>${ST[here]}`:'เดินไปที่จุดต่าง ๆ'}</b>
    <div class="row" style="margin-top:8px">${A.map((a,i)=>`<button ${a.ok?'':'disabled'} onclick="doAction(${i})">${a.label}</button>`).join('')}</div>`);
  put('jar', coinRow(s.coins[s.shift-1]) || '<span class="soft">ยังไม่มีเหรียญ</span>');
  put('inv', invHTML());
  put('modal', modalHTML());
}
function invHTML(){
  // ช่องมือ: ของที่ถืออยู่ + จำนวน
  const h = s.hand, n = !h ? '' : h.n ?? h.items.length;
  const hand = `<div class="slot" title="ของในมือ">${h ? sp(h.kind) + `<span class="n">${n}</span>` : ''}</div>`;
  // ใบออเดอร์ที่รับแล้ว: เรียงจากเก่าสุด สีเวลาเปลี่ยนตามที่เหลือก่อนเลยเป้า
  const where = [];
  s.tickets.forEach(o=>where.push([o,'รอตาก']));
  s.jobs.forEach(j=>j.order && where.push([j.order,'กำลังตาก']));
  if(s.pan && s.pan.order) where.push([s.pan.order, s.t>=s.pan.end?'ทอดเสร็จ รอตัก':'กำลังทอด']);
  s.yardDone.forEach(c=>c.order && where.push([c.order,'ตากเสร็จ รอยก']));
  [...s.shelf,...s.packIn].forEach(c=>c.order && where.push([c.order,'รอแพ็ก']));
  s.ready.forEach(c=>c.order && where.push([c.order,'แพ็กแล้ว']));
  if(handIs('bag')) s.hand.items.forEach(c=>where.push([c.order, c.signed?'เซ็นแล้ว':'ถือไว้']));
  if(handIs('tray')) s.hand.items.forEach(c=>c.order && where.push([c.order, c.mill?'ถือไปบด':'ถือถาด']));
  if(handIs('ticket')) s.hand.items.forEach(o=>where.push([o,'ยังไม่ได้แขวน']));
  tableItems('ticket').forEach(o=>where.push([o,'วางบนโต๊ะ ยังไม่ได้แขวน']));
  [...tableItems('tray'),...tableItems('bag')].forEach(c=>c.order && where.push([c.order,'วางบนโต๊ะ']));
  where.sort((a,b)=>a[0].t-b[0].t);
  const rc = where.map(([o,st])=>{ const left = Math.ceil(RULE.onTime - (s.t - o.t));
    const col = left<=0 ? '#c2452f' : left<30 ? '#e0702e' : '#2f8a3e';
    return `<div class="rcpt" title="${PROD[o.prod].n} #${o.id} · ${st}" ${o.hung===undefined?'style="box-shadow:inset 0 0 0 2px #c2452f;background:#fde3d8"':''}>${sp(PROD[o.prod].spr)}#${o.id}<span class="tm" style="background:${col}">${left>0?left+'s':'ช้า'}</span></div>`; }).join('');
  const waiting = s.pending.length ? `<span class="inv-label">รอรับอีก ${s.pending.length}</span>` : '';
  return `<span class="inv-label">มือ</span>${hand}<span class="inv-label">ใบออเดอร์</span>
    <div class="receipts">${rc || '<span class="soft" style="font-size:13px;align-self:center">ยังไม่ได้รับ</span>'}</div>${waiting}`;
}

/* ───────── หน้าจัดร้าน + spaghetti diagram ─────────
   เส้นแดงคือทางที่เดินจริงในกะ 1 ทุกก้าว เส้นซ้อนกันมากตรงไหน สีเข้มตรงนั้น
   แตะจุดหนึ่งครั้งเพื่อเลือก แล้วแตะช่องว่างเพื่อวาง (ใช้กับนิ้วบนมือถือได้ ไม่ต้องลาก) */
let arrSel = null, arrHist = [], arrTrail = true;   // ย้อนการย้ายได้ทีละครั้ง · ซ่อน/โชว์เส้นทางกะ 1
function cycleLen(lay){
  // ระยะเดิน 1 รอบงาน: รับออเดอร์ → ราวออเดอร์ → สวน → ลานตาก → (ชั้นพัก) → แพ็ก → (ประธาน) → ส่ง → กลับรับออเดอร์
  const keep = L; L = lay; let n = 0;
  const seq = ['order','rail','garden','yard', lay.at.shelf?'shelf':null,'pack', lay.at.boss?'boss':null,'send','order'].filter(Boolean);
  for(let i=1;i<seq.length;i++){ const p = path(lay.at[seq[i-1]], lay.at[seq[i]]); n += p ? p.length : 99; }
  L = keep; return n;
}
function arrClick(x,y){
  const lay = layout(true);
  const hit = Object.keys(lay.at).find(k=>lay.at[k] && lay.at[k][0]===x && lay.at[k][1]===y);
  if(hit){ if(MOVABLE.includes(hit)){ arrSel = arrSel===hit ? null : hit; } else toast('สวนกล้วยย้ายไม่ได้ ต้นกล้วยปลูกอยู่ตรงนั้น'); render(); return; }
  if(!arrSel){ toast('แตะจุดที่มีกรอบประสีส้มก่อน'); return; }
  if(lay.crates.some(([a,b])=>a===x&&b===y)){ toast('ตรงนั้นมีลังวางอยู่'); return; }
  arrHist.push([arrSel, s.layout[arrSel].slice()]); s.layout[arrSel] = [x,y]; arrSel = null; render();
}
function arrUndo(){ const h = arrHist.pop(); if(h){ s.layout[h[0]] = h[1]; arrSel = null; render(); } }
function arrReset(){ s.layout = JSON.parse(JSON.stringify(START)); arrHist = []; arrSel = null; render(); }
function arrangeView(){
  const lay = layout(true), t = tileSize();
  let tiles='';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const st = Object.keys(lay.at).find(k=>lay.at[k] && lay.at[k][0]===x && lay.at[k][1]===y);
    const crate = lay.crates.some(([a,b])=>a===x&&b===y), mark = lay.marks.some(([a,b])=>a===x&&b===y);
    // ทำให้ดูง่าย (ผู้ใช้ขอ 11 พ.ย.): จุดที่ย้ายได้มีกรอบประ · จุดที่เลือกกรอบเหลืองกะพริบ · ช่องที่วางได้เป็นสีเขียว
    const can = !st && !crate, movable = st && MOVABLE.includes(st);
    const deco = st && st===arrSel ? 'outline:4px solid #f5c542;outline-offset:-4px;animation:blink .5s steps(2) infinite'
      : (arrSel && can) ? 'box-shadow:inset 0 0 0 999px rgba(47,138,62,.38);cursor:pointer'
      : (!arrSel && movable) ? 'outline:3px dashed #e0702e;outline-offset:-3px;box-shadow:inset 0 0 0 999px rgba(245,197,66,.28);cursor:pointer' : '';
    tiles += `<div class="tile ${mark?'mark':''}" style="background-image:url(${SPR[st==='garden'?'grass':'floor']});${deco}" onclick="arrClick(${x},${y})">
      ${st?sp(st==='bin'?'bin':st)+`<span class="label">${ST[st]}${st==='garden'?' (ย้ายไม่ได้)':''}</span>`:crate?sp('crate'):''}</div>`;
  }
  // เส้นทางกะ 1: วาดเป็นเส้นตรงระหว่างก้าวที่ติดกัน โปร่งแสง ทับกันแล้วเข้มขึ้นเอง
  const tr = s.trail1, seg = [];
  for(let i=1;i<tr.length;i++){ const [a,b]=tr[i-1], [c,d]=tr[i];
    seg.push(`<line x1="${(a+.5)*t}" y1="${(b+.5)*t}" x2="${(c+.5)*t}" y2="${(d+.5)*t}"/>`); }
  const before = cycleLen(layout(false)), after = cycleLen(lay);
  const moved = MOVABLE.filter(k=>key(...s.layout[k])!==key(...START[k])).length;
  const diff = before - after;
  // แถบขั้นตอน: บอกว่าตอนนี้ต้องแตะอะไร
  const step = arrSel
    ? `<div class="quest tut"><b>ขั้น 2 ›</b><span class="big2"><span style="width:28px;height:28px;display:inline-block;vertical-align:middle">${sp(arrSel==='bin'?'bin':arrSel)}</span> ${ST[arrSel]} → แตะ<b style="color:#2f8a3e">ช่องสีเขียว</b>ที่อยากวาง</span>
        <button onclick="arrSel=null;render()">ยกเลิก</button></div>`
    : `<div class="quest tut"><b>ขั้น 1 ›</b><span class="big2">แตะจุดที่มี<b style="color:#e0702e">กรอบประสีส้ม</b>เพื่อเลือกจุดที่จะย้าย</span></div>`;
  return `
  <div class="card center"><h2>จัดร้านใหม่</h2>
    <p class="soft">ย้ายจุดที่ต้องเดินไปมาบ่อยให้อยู่ใกล้กัน · สวนกล้วยย้ายไม่ได้ ลองย้ายลานตากไปใกล้สวนแทน</p></div>
  ${step}
  <div class="wrap" style="--t:${t}px;--w:${W}">
    <div class="map">${tiles}</div>
    ${arrTrail?`<svg class="dyn" width="${t*W}" height="${t*H}" style="stroke:#d0302a;stroke-opacity:.18;stroke-width:${Math.max(3,t/9)};stroke-linecap:round">${seg.join('')}</svg>`:''}
  </div>
  <div class="card center">
    <p class="soft">ระยะเดิน 1 รอบงาน (รับออเดอร์ → สวน → ลานตาก → แพ็ก → ส่ง)</p>
    <p class="big px">${before} → <span class="${diff>0?'ok':diff<0?'no':''}">${after}</span> ช่อง</p>
    <p>${diff>0?`<b class="ok">เดินน้อยลง ${diff} ช่องต่อรอบ</b>`:diff<0?`<b class="no">เดินมากขึ้น ${-diff} ช่องต่อรอบ</b>`:'ยังไม่ได้ย้าย'}</p>
    <p class="soft">ย้ายแล้ว ${moved} จุด · ต้นกะ 2 เสียเวลาจัดร้าน ${moved*RULE.moveEach} วินาที</p>
    <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
      <button onclick="arrUndo()" ${arrHist.length?'':'disabled'}>↶ ย้อน 1 ครั้ง</button>
      <button onclick="arrReset()">คืนค่าเดิม</button>
      <button onclick="arrTrail=!arrTrail;render()">${arrTrail?'ซ่อน':'โชว์'}เส้นทางกะ 1</button>
    </div>
    <p class="soft">${arrTrail?`เส้นแดง = ทางที่เดินจริงในกะ 1 (${tr.length} ก้าว) · เส้นเข้ม = เดินซ้ำเยอะ`:''}</p>
    <button class="go" onclick="arrSel=null;arrHist=[];go('sop')">ต่อ ▶</button>
  </div>`;
}

  <div class="card"><table>${COINS.map(c=>{ const ex=s.log[0].find(t=>t.includes(LABEL[c]+' · ')); const g=s.guesses[c];
    return `<tr><td><span class="coin">${LABEL[c]}</span></td><td><b>${MEAN[c][0]}</b><br><small class="soft">${MEAN[c][1]}</small></td>
    <td class="soft">${ex?ex.split(' · ')[1]:''}</td><td>${g===undefined?'':g===c?'<span class="ok">✓</span>':'<span class="no">✗</span>'}</td></tr>`;}).join('')}
  </table></div><div class="center"><button class="go" onclick="go('analyse')">ต่อ ▶</button></div>`,
analyse: () => {
  const Lk=[['O2','I','ตากเผื่อแล้วยังไม่มีคนสั่ง กลายเป็นของค้างสต็อก'],['D','W','ปล่อยไว้จนไหม้ ต้องทำใหม่ ออเดอร์รอนานขึ้น'],['O1','W','ยืนรอประธานเซ็น ไม่มีใครไปตาก'],['M','W','เดินอ้อมลังจนเสียเวลา'],
    ['O2','W','ลานตากถูกใช้ตากเผื่อ ออเดอร์จริงต้องรอ'],['T','M','สวนไกล ต้องเดินไปเก็บ'],['S','D','มีวิธีดีกว่าแต่ทำไม่ได้']];
  return `<div class="card center"><h2>ตัวไหนทำให้เกิดตัวไหน?</h2><p class="soft">แก้ที่ต้นเหตุ ปลายเหตุจะลดเอง (5 Whys)</p></div>
  <div class="card">${Lk.map(([a,b,t])=>`<div class="row" style="padding:6px 0;border-bottom:3px dotted var(--line)">
    <span class="coin">${LABEL[a]}</span> › <span class="coin">${LABEL[b]}</span> <span>${t}</span>
    <span class="soft" style="margin-left:auto">${s.coins[0][a]} → ${s.coins[0][b]}</span></div>`).join('')}</div>
  <div class="center"><button class="go" onclick="go('improve')">ไปร้านอัปเกรด ▶</button></div>`;
},
improve: () => {
  const b = budget(), u = spent();
  const fixRow = c => { const [e,p,what,cost]=FIX[c], on=s.fixes.has(c); return `<label class="pick ${on?'on':''}">
    <input type="checkbox" ${on?'checked':''} onchange="buy('${c}')"><span class="coin">${LABEL[c]}</span>
    <span style="width:32px;height:32px;display:inline-block;flex:none">${sp(e)}</span>
    <span style="flex:1"><b>${p}</b> <span class="soft">(กะ 1 ได้ ×${s.coins[0][c]})</span><small>${what}${cost!=='—'?' · แลก: '+cost:''}</small></span>
    <b class="px">${PRICE[c]}฿</b></label>`; };
  const gearRow = k => { const g=GEAR[k], on=s.equip.has(k); return `<label class="pick ${on?'on':''}">
    <input type="checkbox" ${on?'checked':''} onchange="buy('${k}')"><span class="chip" style="font-size:11px">อุปกรณ์</span>
    <span style="width:32px;height:32px;display:inline-block;flex:none">${sp(g.spr)}</span>
    ${g.tags.length?g.tags.map(c=>`<span class="coin">${LABEL[c]}</span>`).join(''):'<span class="chip" style="background:#888;font-size:11px">ไม่ลดเหรียญ</span>'}
    <span style="flex:1"><b>${g.name}</b><small>${g.what} · ${g.hint}</small></span><b class="px">${g.price}฿</b></label>`; };
  return `<div class="card center"><h2>ร้านอัปเกรด</h2>
    <p class="big px">ใช้ไป ${u} / งบ ${b} ฿</p>
    <p class="soft">ทุกบาทที่ซื้อ หักจากกำไรกะ 2 · เหรียญ 1 เหรียญ = ${RULE.coinCost} ฿ · ส่งทัน 1 ถุง = ${RULE.bagPrice} ฿</p>
    <p class="soft">ซื้อเฉพาะที่คิดว่าคุ้ม ดูกองเหรียญตัวเองก่อน</p></div>
  ${s.ideas.length?`<div class="card">ไอเดียที่ประธานไม่ให้ทำ: ${s.ideas.map(esc).join(' · ')}</div>`:''}
  <div class="card"><b>ปรับวิธีทำงาน</b></div>${COINS.filter(c=>!['I','S','O2'].includes(c)).map(fixRow).join('')}
  <div class="card"><b>ซื้ออุปกรณ์ / จ้างคนนอก</b></div>${Object.keys(GEAR).map(gearRow).join('')}
  <div class="center">${u>b?'<p class="no">ใช้เกินงบ เอาของออกก่อน</p>':''}<button class="go" onclick="go('arrange')" ${u>b?'disabled':''}>ต่อ ▶</button></div>`;
},
sop: () => {
  if(!s.sop.some(x=>x.trim())) s.sop=[...[...s.fixes].map(f=>FIX[f][2]), ...[...s.equip].map(k=>GEAR[k].what), '', '', ''].slice(0,3);
  return `<div class="card center"><h2>SOP 3 บรรทัด</h2><p class="soft">ใครมาทำก็ทำแบบเดียวกัน</p></div>
  <div class="card">${s.sop.map((x,i)=>`<p>${i+1}. <input type="text" style="width:88%" value="${esc(x)}" oninput="s.sop[${i}]=this.value"></p>`).join('')}</div>
  <div class="center"><button class="go" onclick="s.shift=2;go('play')">เริ่มกะ 2 ▶</button></div>`;
},
debrief: () => {
  const a=s.coins[0], b=s.coins[1], sum=(o,set)=>set.reduce((n,c)=>n+o[c],0);
  // จัดร้านใหม่เอง (ย้ายจุดใดก็ได้) = แก้ T ด้วย แม้ไม่ได้ซื้อข้อ T
  const moved = MOVABLE.some(k=>key(...s.layout[k])!==key(...START[k])) || s.equip.has('consult');
  const fixed = c => s.fixes.has(c) || (c==='T' && moved);
  const fx=COINS.filter(fixed), un=COINS.filter(c=>!fixed(c));
  const dl = n => n>=0 ? '−'+n : '+'+(-n);
  const dF=sum(a,fx)-sum(b,fx), dU=sum(a,un)-sum(b,un);
  return `<div class="card center"><h2>สรุป 2 กะ</h2><div class="row" style="justify-content:center;gap:24px">${stat(0)}${stat(1)}</div></div>
  <div class="card"><table><tr><th></th><th>กะ 1</th><th>กะ 2</th><th></th></tr>
  ${COINS.map(c=>`<tr><td><span class="coin">${LABEL[c]}</span></td><td>${a[c]}</td><td>${b[c]}</td><td>${fixed(c)?'<b class="ok">ปรับ</b>':''}</td></tr>`).join('')}
  <tr><th>ที่ปรับ</th><th>${sum(a,fx)}</th><th>${sum(b,fx)}</th><th>${dl(dF)}</th></tr>
  <tr><th>ไม่ได้ปรับ</th><th>${sum(a,un)}</th><th>${sum(b,un)}</th><th>${dl(dU)}</th></tr></table>
  <p class="center soft">ไม่ได้ปรับลด = ความคล่อง · ที่ปรับลด${dF>dU?'มากกว่า = <b class="ok">ระบบดีขึ้น</b>':'ไม่มากกว่า = <b class="no">ลองเลือกแก้ที่ต้นเหตุ</b>'}</p></div>
  <div class="card"><b>ใช้เงินไป ${spent()} ฿</b> · ปรับวิธีทำงาน ${[...s.fixes].reduce((n,k)=>n+PRICE[k],0)} ฿ · อุปกรณ์/จ้างคนนอก ${[...s.equip].reduce((n,k)=>n+GEAR[k].price,0)} ฿
    ${[...s.equip].map(k=>`<p>${GEAR[k].name}: <span class="soft">${GEAR[k].lesson}</span></p>`).join('') || '<p class="soft">ไม่ได้ซื้ออุปกรณ์ แก้ด้วยการปรับวิธีทำงานอย่างเดียว</p>'}
    <p class="soft">Lean: ปรับวิธีทำงานก่อน ค่อยซื้อของ</p></div>
  <div class="card center"><p class="big">ปัญหาอยู่ที่ระบบ ไม่ใช่ที่คน</p>
    <p class="soft">ในมหาลัยเจอเหรียญตัวไหนบ้าง? คิวโรงอาหาร · รอเพื่อนส่งงาน · ปริ้นท์เผื่อ · กรอกฟอร์มผิด</p>
    <button onclick="s=fresh();go('intro')">เล่นใหม่</button></div>`;
}
};
function stat(i){ const t=s.stats[i]; if(!t) return '';
  return `<div><p class="soft">กะ ${i+1} · กำไร</p><p class="big ${t.score<0?'no':'ok'}">${t.score} ฿</p>
    <p class="soft">ส่งทัน ${t.ok}/${t.total} +${t.income} · waste ${t.coins} เหรียญ −${t.waste}${t.buyCost?` · ซื้อของ −${t.buyCost}`:''}</p></div>`; }
function esc(t){ return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function saveGuess(){ document.querySelectorAll('[data-g]').forEach(el=>{ if(el.value) s.guesses[el.dataset.g]=el.value; }); }
function go(v){ if(v==='play') startShift(); screen=v; render(); window.scrollTo(0,0); }
function render(){ app.innerHTML = V[screen](); if(screen==='play') live(true); }
addEventListener('keydown',e=>{
  if(screen!=='play' || e.target.tagName==='INPUT') return;
  if(e.key==='p'||e.key==='P'){ togglePause(); return; }
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(m){ e.preventDefault(); nudge(...m); return; }
  if(/^[1-6]$/.test(e.key)) doAction(+e.key-1);
});
addEventListener('resize',()=>{ if(screen==='play'){ render(); } });
// ลูปหลัก: เดินเวลา 0.1 วินาทีแล้ววาดส่วนที่ขยับ · แท็บถูกซ่อนจะหยุดเอง (เบราว์เซอร์ชะลอ setInterval)
setInterval(()=>{ if(screen==='play'){ update(0.1); if(screen==='play') live(); } }, 100);
s = fresh(); render();
</script>
</body>
</html>
